name: CodeProof pull request report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CodeProof
        run: python -m pip install -e ".[dev]"
      - name: Analyze the proposed change
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          verity-codeproof check --base "$BASE_REF" --format markdown --output codeproof-report.md --fail-on high
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeproof-report
          path: codeproof-report.md
          if-no-files-found: ignore

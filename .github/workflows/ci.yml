name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check src tests
      - name: Run tests
        run: pytest
      - name: Smoke-test installed CLI and HTML report
        run: verity-codeproof demo --format html --output /tmp/codeproof-demo.html && test -s /tmp/codeproof-demo.html

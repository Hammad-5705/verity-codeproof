<rect x="48" y="477" width="1104" height="92" rx="14" fill="#091724" stroke="#263f57"/>
<text x="72" y="509" fill="#4de2d0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">GUARDRAILS</text>
<text x="72" y="538" fill="#c2d5e6" font-family="Inter,Arial,sans-serif" font-size="14">No automatic source upload · No automatic code edits · No automatic merge · Test execution is not a sandbox</text>
</svg>
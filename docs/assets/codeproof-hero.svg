<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">VerityAgent CodeProof</title>
<desc id="desc">An evidence-first AI code verification agent. Inspect the diff, verify behavior, report evidence.</desc>

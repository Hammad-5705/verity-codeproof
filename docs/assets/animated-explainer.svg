<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Animated CodeProof verification loop</title><desc id="desc">A glowing signal moves from a Git diff through deterministic analysis, optional AI and tests, and into an evidence report.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07111f"/><stop offset=".5" stop-color="#0e2033"/><stop offset="1" stop-color="#081321"/></linearGradient>
 <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#337e8e"/><stop offset=".5" stop-color="#4de2d0"/><stop offset="1" stop-color="#3aaeff"/></linearGradient>
 <filter id="shine"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="250" rx="22" fill="url(#bg)" stroke="#27435a"/>
<text x="32" y="36" fill="#4de2d0" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2">THE VERIFICATION LOOP</text>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <rect x="30" y="77" width="235" height="105" rx="14" fill="#10243a" stroke="#3a647d"/>
 <text x="147" y="115" fill="#7da4c2" font-size="11" font-weight="800">01 / INPUT</text><text x="147" y="143" fill="#f2f7ff" font-size="19" font-weight="700">Git diff</text><text x="147" y="164" fill="#a8c1d5" font-size="12">What changed?</text>
 <rect x="320" y="77" width="235" height="105" rx="14" fill="#102d34" stroke="#2e817d"/>
 <text x="437" y="115" fill="#4de2d0" font-size="11" font-weight="800">02 / INSPECT</text><text x="437" y="143" fill="#f2f7ff" font-size="19" font-weight="700">Local checks</text><text x="437" y="164" fill="#a8c1d5" font-size="12">Which risks are visible?</text>
 <rect x="610" y="77" width="235" height="105" rx="14" fill="#17283d" stroke="#536c8e"/>
 <text x="727" y="115" fill="#9ab8ff" font-size="11" font-weight="800">03 / CHALLENGE</text><text x="727" y="143" fill="#f2f7ff" font-size="19" font-weight="700">AI + tests*</text><text x="727" y="164" fill="#a8c1d5" font-size="12">Only when requested</text>
 <rect x="900" y="77" width="270" height="105" rx="14" fill="#102d34" stroke="#2e817d"/>
 <text x="1035" y="115" fill="#4de2d0" font-size="11" font-weight="800">04 / DELIVER</text><text x="1035" y="143" fill="#f2f7ff" font-size="19" font-weight="700">Evidence report</text><text x="1035" y="164" fill="#a8c1d5" font-size="12">Human makes the decision</text>
</g>
<g stroke="url(#edge)" stroke-width="2" fill="none"><path d="M265 130H315"/><path d="M555 130H605"/><path d="M845 130H895"/></g>
<g filter="url(#shine)"><circle r="5" fill="#f5fffd"><animateMotion dur="4s" repeatCount="indefinite" path="M265 130H315 M555 130H605 M845 130H895"/></circle>
<circle r="3" fill="#4de2d0"><animate attributeName="opacity" values=".15;1;.15" dur="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="2;5;2" dur="1.6s" repeatCount="indefinite"/></circle></g>
<text x="32" y="220" fill="#7999b2" font-family="Inter,Arial,sans-serif" font-size="12">* AI is opt-in. Test execution is opt-in and must run in a suitable isolated environment for untrusted code.</text>
</svg>